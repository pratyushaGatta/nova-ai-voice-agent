trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  acrLoginServer: 'acrnova51596.azurecr.io'
  imageRepository: 'nova-ai-voice-agent'
  containerAppName: 'ca-nova-agent'
  resourceGroup: 'rg-nova-ai'
  imageTag: '$(Build.BuildId)'

stages:

- stage: Build
  displayName: Build and Push
  jobs:
  - job: BuildImage
    steps:

    - task: Docker@2
      displayName: Build and Push Nova Image
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: '**/Dockerfile'
        containerRegistry: 'sc-nova-acr'
        tags: |
          $(imageTag)

- stage: Deploy
  displayName: Deploy to Azure Container Apps
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployNova
    steps:

    - task: AzureCLI@2
      displayName: Deploy Nova
      inputs:
        azureSubscription: 'sc-nova-azure'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az containerapp update \
            --name $(containerAppName) \
            --resource-group $(resourceGroup) \
            --image $(acrLoginServer)/$(imageRepository):$(imageTag)